         <body>
            <h2>Enquiry</h2>
            <form class="form-card" id="enquiry-form">
                <label for="name">First Name* </label>
                <br>
                <input type="text" id="name" name="name" required>
                <small class="error" id="name-error"></small>
                <br>
                <label for="surname">Surname* </label>
                <br>
                <input type="text" id="surname" name="surname" required>
                <small class="error" id="surname-error"></small>
                <br>
                <label for="email">Email* </label>
                <br>
                <input type="email" id="email" name="email" required>
                <small class="error" id="email-error"></small>
                <br>
                <label for="phone">Phone Number</label>
                <br>
                <input type="tel" id="phone" name="phone" placeholder="0822172610">
                <small class="error" id="phone-error"></small>
                <br>
                <label for="gym wear type">Gym Wear Type</label>
                <br>
                <select id="gym-wear-type" name="gym-wear-type">
                    <option value="">Select gym wear type</option>
                    <option value="black jumpsuit">Black Jumpsuit</option>
                    <option value="short set">Short Set</option>
                    <option value="purple set">Purple Set</option> 
                 </select>
                <small class="error" id="gym-wear-selection-error"></small>
                <br>
                <button type="submit" class="btn" btn-primary>Submit</button>
                <p id="form-status" role="status"></p>

                </form>
